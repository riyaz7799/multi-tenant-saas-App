openapi: 3.0.0
info:
  title: Multi-Tenant SaaS API
  version: 1.0.0

servers:
  - url: http://localhost:5000

paths:
  /api/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login success

  /api/projects:
    get:
      summary: Get projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
